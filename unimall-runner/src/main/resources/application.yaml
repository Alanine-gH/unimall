server:
  port: 8000
  servlet:
    context-path: /unimall

# 本地调试可以关闭，其他环境建议开启日志打印
logging:
  config: classpath:logs/logback.xml
  file:
    path: logs/${spring.application.name}

spring:
  application:
    name: unimall
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      auto-commit: true
      connection-test-query: SELECT 1
      connection-timeout: 30000
      idle-timeout: 30000
      maximum-pool-size: 15
      minimum-idle: 5
    password: 20060214
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://localhost:3306/unimall?autoReconnect=true&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true
    username: root

  redis:
    master-name: mymaster
    mode: single
    database: 2
    host: localhost:6379
  user-redis:
    database: 0
    host: localhost:6379
  lock-redis:
    database: 0
    host: localhost:6379

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      table-prefix: unimall_
  mapper-locations: classpath:/mapper/**/*.xml

com:
  dobbinsoft:
    db:
      # 类自动生成表结构
      auto-build-table: false
    system:
      admin-session-period: 43200
      user-session-period: 43200
      mutex-login: true # 是否允许同一个账户多地登录
    oss:
      enable: mock
      ali-access-key-id: xxx
      ali-access-key-secret: xxx
      ali-endpoint: xxx
      ali-bucket: xxx
      ali-base-url: xxx
    sms:
      enable: mock
      aliyun-access-key-id: xxx
      aliyun-access-key-secret: xxx
      aliyun-signature: xxx
      aliyun-register-template-id: xxx
      aliyun-bind-phone-template-id: xxx
      aliyun-reset-password-template-id: xxx
      aliyun-admin-login-template-id: xxx

    admin-notify:
      enable: mock
    advert:
      top-sales-num: 10
    order:
      auto-confirm-time: 259200
      auto-cancel-time: 900
    wx-app:
      app-id: xxx
      app-secret: xxx
      mini-app-id: xxx
      mini-app-secret: xxx
      h5-app-id: xxx
      h5-app-secret: xxx
    wx-pay:
      mch-id: xxx
      mch-key: xxx
      key-path: C:/cert/application.p12
      notify-url: https://unimallv4.dobbinsoft.com/unimall/cb/pay
    ali-app:
      ali-gateway: https://openapi.alipay.com/gateway.do
      app-id: 2021004150664371
      app-private-key2: 
